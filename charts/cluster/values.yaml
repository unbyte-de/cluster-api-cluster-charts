---
exports:
  data:
    capi:
      # See Compatibility documentation in README
      providers:
        core:
          name: cluster-api
        # https://cluster-api.sigs.k8s.io/tasks/bootstrap/kubeadm-bootstrap/#kubeadmconfig-objects
        # https://kubernetes.io/docs/reference/config-api/kubeadm-config.v1beta3/
        controlPlane:
          name: kubeadm
        bootstrap:
          name: kubeadm
        infrastructure:
          name: hetzner

    cluster:
      # Default is the release name.
      name: ""

    networking:
      apiPort: 6443
      # networkIpv4Cidr: ""
      # subnetIpv4Cidr: ""
      # servicesIpv4Cidr: ""
      # podsIpv4Cidr: ""

    machines:
      cp:
        osVersion: "" # e.g. "2404"
        k8sVersion: "" # e.g. "v1.31.4"
        imageName: ""
        replicas: 3
        # https://cluster-api.sigs.k8s.io/tasks/automated-machine-management/healthchecking
        # https://doc.crds.dev/github.com/kubernetes-sigs/cluster-api/cluster.x-k8s.io/MachineHealthCheck/v1beta2@v1.13.2
        healthCheck:
          enabled: true
          checks:
            # determines how long a MachineHealthCheck should wait for a Node to join the cluster, before considering a Machine unhealthy.
            nodeStartupTimeoutSeconds: 900 # 15 minutes
            # Conditions to check on Nodes for matched Machines, if any condition is matched for the duration of its timeout,
            # the Machine is considered unhealthy
            unhealthyNodeConditions:
            - type: Ready
              status: Unknown
              timeoutSeconds: 300
            - type: Ready
              status: "False"
              timeoutSeconds: 300
              # unhealthyMachineConditions: []
          remediation:
            # This is used only if remediation is enabled.
            triggerIf:
              # Remediate a control-plane Machine only while at most 1 is unhealthy (short circuit).
              # If more are unhealthy at the same time, the cause is almost never the machines
              # themselves (overload, etcd, network), and rebooting/replacing them only takes etcd
              # quorum away and keeps the control plane down. With 100% (the CAPI default) a
              # memory problem on azl-stage became a reboot/replace storm of all 3 control-plane
              # machines (2026-11-23). Recovery of a multi-node failure is then a manual decision.
              unhealthyLessThanOrEqualTo: 1
      # Multi-pool worker config.
      # Each entry under `pools` becomes its own MachineDeployment + HCloudMachineTemplate + KubeadmConfigTemplate (+ MachineHealthCheck).
      # Bare-metal pools render HetznerBareMetalHosts + a HetznerBareMetalMachineTemplate instead, see `hCloud.machines.workers.defaults.bareMetal`.
      # `defaults` is merged into every pool; per-pool fields win.
      workers:
        defaults:
          osVersion: "" # e.g. "2404"
          k8sVersion: "" # e.g. "v1.31.4"
          imageName: ""
          # If autoscaler is enabled, replicas is in effect only until autoscaler is active, e.g. during bootstrap of the cluster.
          replicas: 3
          # If autoscaler is enabled, replicas must be ignored by ArgoCD.
          autoscaler:
            # Adds annotations to MachineDeployment for Kubernetes Autoscaler (https://github.com/kubernetes/autoscaler).
            enabled: false
            minSize: ""
            maxSize: ""
          # Extra node labels and taints, set by kubeadm when a node joins (nodeRegistration), so changing them replaces the pool's nodes.
          # Every worker also gets `node.kubernetes.io/role=worker`. kubelets can't set most labels in the kubernetes.io and k8s.io namespaces.
          nodeLabels: {}
          # nodeLabels:
          #   nodepool: gpu
          nodeTaints: []
          # nodeTaints:
          # - key: nvidia.com/gpu
          #   value: present
          #   effect: NoSchedule
          healthCheck:
            enabled: true
            checks:
              # determines how long a MachineHealthCheck should wait for a Node to join the cluster, before considering a Machine unhealthy.
              nodeStartupTimeoutSeconds: 600 # 10 minutes
              # Conditions to check on Nodes for matched Machines, if any condition is matched for the duration of its timeout,
              # the Machine is considered unhealthy
              unhealthyNodeConditions:
              - type: Ready
                status: Unknown
                timeoutSeconds: 180
              - type: Ready
                status: "False"
                timeoutSeconds: 180
                # unhealthyMachineConditions:
                # - type: "NodeReady"
                #   status: Unknown
                #   timeoutSeconds: 1800
                # - type: "InfrastructureReady"
                #   status: "False"
                #   timeoutSeconds: 1800
            remediation:
              # This is used only if remediation is enabled.
              triggerIf:
                # The default value for unhealthyLessThanOrEqualTo is 100%.
                # This means the short circuiting mechanism is disabled by default and Machines will be remediated no matter the state of the cluster.
                unhealthyLessThanOrEqualTo: 100%
        pools: {}
        # pools:
        #   # The pool named "default" renders with un-suffixed resource names (`<cluster>-worker`) so it lines up with the legacy `machines.worker:` block.
        #   default: {}

    hCloud:
      # https://syself.com/docs/caph/topics/managing-ssh-keys
      sshKeys:
      # - "name"
      # Dedicated (Robot) servers. Only used if at least one worker pool has `bareMetal.enabled: true`.
      robot:
        # Secret with the SSH key CAPH uses to log in to the rescue system (HetznerCluster.spec.sshKeys.robotRescueSecretRef).
        # Bare-metal pools use the same secret after installimage by default (`bareMetal.sshSpec`).
        # The key name stored under `key.name` must match a key in Robot (Server > Key Management).
        rescueSshSecretRef:
          name: robot-ssh
          key:
            name: sshkey-name
            publicKey: ssh-publickey
            privateKey: ssh-privatekey
        # Give bare-metal nodes the `hrobot://<server-id>` ProviderID instead of CAPH's default `hcloud://bm-<server-id>`.
        # The CCM must set the same format, or new nodes never join: the upstream hcloud-cloud-controller-manager always uses
        # `hrobot://`, Syself's fork (syself/hetzner-cloud-controller-manager >= v2.0.6) only with HCLOUD_USE_HROBOT_PROVIDER_ID_FOR_BAREMETAL=true.
        # https://syself.com/docs/caph/topics/baremetal/creating-workload-cluster
        useHrobotProviderID: true
      token:
        # If true (default, recommended), the chart references an existing Secret
        # by `secretName` and you create it out of band (ExternalSecrets, sealed
        # secret, `kubectl create secret`, etc.). If false, the chart renders the
        # Secret itself from `value` below; the token then lives in plaintext in
        # your values.yaml, Helm release secret, and any rendered diff.
        existingSecret: true
        # Token value used only when `existingSecret: false`.
        # Emitted via stringData (Helm doesn't encrypt this — kube-apiserver base64-encodes server-side).
        value: ""
        # Name of the Secret (referenced when existingSecret: true, created when false).
        secretName: "hcloud"
        # Key within the Secret containing the Hetzner API token.
        secretKey: "token"
        # For when creating new secret and for CAPI mgt clusters only.
        # Adds `clusterctl.cluster.x-k8s.io/move` label or not.
        move: false
      networking:
        # apiPort: 6443
        # Enable private hCloud network for the cluster.
        hcloudNetworkEnabled: false
        # https://docs.hetzner.com/cloud/general/locations/
        # https://docs.hetzner.com/cloud/networks/faq/#can-networks-span-multiple-locations
        region: "" # e.g. "fsn1" or "nbg1"
        # Required only private hCloud network is enabled (hcloudNetworkEnabled).
        # networkZone: eu-central
        # Considerations on the IP Ranges. Required only private hCloud network is enabled.
        # https://github.com/hetznercloud/hcloud-cloud-controller-manager/blob/v1.20.0/docs/deploy_with_networks.md#considerations-on-the-ip-ranges
        # https://docs.hetzner.com/cloud/networks/faq/#which-ip-addresses-can-i-use
        # https://docs.hetzner.com/cloud/networks/faq/#are-any-ip-addresses-reserved
        # https://docs.hetzner.com/cloud/networks/faq/#are-there-any-limits-on-how-networks-can-be-used
        # networkIpv4Cidr: ""
        # Required only private hCloud network is enabled (hcloudNetworkEnabled).
        # https://docs.hetzner.com/cloud/networks/faq/#what-are-subnets
        # subnetIpv4Cidr: ""
        servicesIpv4Cidr: ""
        podsIpv4Cidr: ""
      lb:
        existing:
          # Defaults to the release name.
          name: ""
          ip: ""
          # extraServices:
          # - destinationPort: 50000
          #   listenPort: 50000
          #   protocol: tcp
        new:
        #   extraServices:
        #   - destinationPort: 50000
        #     listenPort: 50000
        #     protocol: tcp
        #   algorithm: round_robin
        #   port: "6443"
        #   region: ""
        #   type: lb11
      machines:
        # List of placement groups that should be defined in Hetzner API
        # https://docs.hetzner.com/cloud/placement-groups/overview
        # https://docs.hetzner.com/cloud/placement-groups/faq#are-placement-groups-location-bound
        placementGroups:
        - name: cp
          type: spread
        - name: worker
          type: spread
        cp:
          # Server types: https://www.hetzner.com/cloud
          type: "" # e.g. cpx32
          placementGroupName: cp
          # https://syself.com/docs/caph/reference/hcloud-remediation-template
          remediation:
            # Enable HCloudRemediation for control plane nodes if needed.
            # Default remediation (MachineHealthChecks) skips CP nodes.
            # > Please note that MachineHealthChecks currently only support Machines that are owned by a MachineSet or a KubeadmControlPlane.
            # https://cluster-api.sigs.k8s.io/tasks/automated-machine-management/healthchecking#limitations-and-caveats-of-a-machinehealthcheck
            enabled: false
            # RetryLimit sets the maximum number of remediation retries. Zero retries if not set.
            retryLimit: 3
            # Timeout sets the timeout between remediation retries. It should be of the form "10m", or "40s".
            timeout: 3m0s
            # By default, the action of remediating a Machine should trigger a new Machine to be created to replace the failed one,
            # but providers are allowed to plug in more sophisticated external remediation solutions.
            # ref: https://cluster-api.sigs.k8s.io/tasks/automated-machine-management/healthchecking#what-is-a-machinehealthcheck
            # Type represents the type of the remediation strategy. At the moment, only "Reboot" is supported.
            type: Reboot
        # Multi-pool hcloud worker config.
        # Keys must match keys under `machines.workers.pools`.
        # Merged with `defaults` below before being merged into the matching pool from `machines.workers.pools`.
        workers:
          defaults:
            # Server types: https://www.hetzner.com/cloud
            type: "" # e.g. cpx42
            placementGroupName: worker
            remediation:
              # Disable HCloudRemediationTemplate and rely on default remediation
              # which should trigger a new Machine to be created to replace the failed one.
              enabled: false
              retryLimit: 3
              timeout: 3m0s
              type: Reboot
            # Bare-metal pool: Hetzner dedicated (Robot) servers instead of hcloud servers.
            # https://syself.com/docs/caph/topics/baremetal/introduction
            # If enabled, the pool renders one HetznerBareMetalHost per entry in `hosts` and a HetznerBareMetalMachineTemplate
            # instead of an HCloudMachineTemplate. `type`, `placementGroupName` and `imageName` are ignored for such a pool,
            # and so is `remediation` (HCloudRemediationTemplate), see `bareMetal.remediation`. The autoscaler can't be enabled.
            bareMetal:
              enabled: false
              # One HetznerBareMetalHost per dedicated server. The pool's machines claim them via hostSelector,
              # so `replicas` must not be higher than the number of hosts.
              # https://syself.com/docs/caph/reference/hetzner-bare-metal-host
              hosts: []
              # - serverID: 1234567 # Server ID from the Robot dashboard.
              #   # Disks to install on. Leave it out on the first sync: CAPH registers the host and waits,
              #   # then `kubectl describe hetznerbaremetalhost` shows the WWNs under hardwareDetails.storage.
              #   # Single disk: `wwn: "<wwn>"`. Software RAID (installImage.swraid: 1): `raid.wwn: ["<wwn>", "<wwn>"]`.
              #   rootDeviceHints:
              #     raid:
              #       wwn:
              #       - "eui.0025388a21b0a1b2"
              #       - "eui.0025388a21b0a1b3"
              #   # Set to true (and sync) before removing a host from this list: the host deprovisions and isn't claimed anymore.
              #   maintenanceMode: false
              #   description: ""
              # https://syself.com/docs/caph/reference/hetzner-bare-metal-machine-template
              installImage:
                image:
                  # Image from Hetzner's NFS share in the rescue system, see `ls /root/.oldroot/nfs/images/`.
                  path: /root/.oldroot/nfs/images/Ubuntu-2404-noble-amd64-base.tar.zst
                # Software RAID1 across the disks in the host's `rootDeviceHints.raid.wwn`.
                swraid: 1
                swraidLevel: 1
                partitions:
                - fileSystem: esp
                  mount: /boot/efi
                  size: 512M
                - fileSystem: ext4
                  mount: /boot
                  size: 1024M
                - fileSystem: ext4
                  mount: /
                  size: all
                # Runs inside the new system after installimage. If `nodeSetup.enabled`, the chart appends the node setup to it.
                # CAPH bootstraps the node with cloud-init, which Hetzner's base image doesn't ship (taken from the upstream CAPH template).
                postInstallScript: |
                  #!/bin/bash
                  set -Eeuo pipefail
                  # Keep the network config written by installimage.
                  mkdir -p /etc/cloud/cloud.cfg.d
                  echo "network: { config: disabled }" > /etc/cloud/cloud.cfg.d/99-custom-networking.cfg
                  apt-get update
                  apt-get install -y cloud-init apparmor apparmor-utils
                  cloud-init clean --logs
              # Node setup that the chart appends to `installImage.postInstallScript`. It gives a dedicated server what
              # our hcloud images get from image-builder v0.1.48 and https://github.com/unbyte-de/cluster-api-machine-images:
              # baseline packages, cloud-init ordered after containerd, containerd and runc from upstream releases,
              # kubelet, kubeadm and kubectl at the pool's `k8sVersion` plus cri-tools and kubernetes-cni from pkgs.k8s.io,
              # kernel modules, sysctls, no swap, yq, and all packages held. See `worker-bare-metal-node-setup` in _helpers.tpl.
              # When bumping `k8sVersion`, keep these versions in line with config/vars/k8s-<minor>.json in that repo.
              # Changing any of this (or `k8sVersion`) renders a new template, so the servers get reinstalled.
              nodeSetup:
                enabled: true
                # Package revision on pkgs.k8s.io, e.g. k8sVersion v1.36.5 -> kubelet=1.36.5-1.1.
                kubernetesDebRevision: "1.1"
                # Must be >= 2.0.0 (the generated config.toml uses config version 3).
                containerdVersion: "2.3.7"
                runcVersion: "1.2.8"
                pauseImage: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
                # Same as config/scripts/additional-tools.sh in cluster-api-machine-images (amd64 binary).
                yq:
                  version: v4.49.2
                  sha256: be2c0ddcf426b6a231648610ec5d1666ae50e9f6473e82f6486f9f4cb6e3e2f7
              # Secret with the SSH key CAPH uses to log in to the server after installimage.
              sshSpec:
                portAfterInstallImage: 22
                secretRef:
                  name: robot-ssh
                  key:
                    name: sshkey-name
                    publicKey: ssh-publickey
                    privateKey: ssh-privatekey
              # Merged over the pool's `healthCheck`. A dedicated server takes much longer than an hcloud server to come up
              # (rescue boot, installimage, node setup, reboot) and to reboot.
              healthCheck:
                checks:
                  nodeStartupTimeoutSeconds: 3600 # 1 hour
                  unhealthyNodeConditions:
                  - type: Ready
                    status: Unknown
                    timeoutSeconds: 300
                  - type: Ready
                    status: "False"
                    timeoutSeconds: 300
              # Used instead of the pool's `remediation`: the MachineHealthCheck reboots an unhealthy server through the Robot API
              # (HetznerBareMetalRemediationTemplate). Disabled, it deletes the Machine, which reinstalls the server and wipes its disks.
              # https://syself.com/docs/caph/reference/hetzner-bare-metal-remediation-template
              remediation:
                enabled: true
                type: Reboot
                retryLimit: 2
                # How long to wait for the node to become healthy after one reboot.
                timeout: 20m
                # If the server needs remediation again within this time after a successful reboot,
                # CAPH skips the reboot and deletes the Machine (reinstall). "0s" turns this off.
                cooldown: 30m
                # When the retries run out: "Reuse" deletes the Machine and reinstalls the server,
                # "Retire" keeps the host out of the pool until someone removes its capi.syself.com/permanent-error annotation.
                onExhaustion: Reuse
              # MachineDeployment rollout. Without a spare server there's nowhere to create a new Machine first,
              # so a rollout deletes one Machine (reinstalling its server) and then provisions it again.
              rollingUpdate:
                maxSurge: 0
                maxUnavailable: 1
          pools: {}
          # pools:
          #   # The pool named "default" renders with un-suffixed resource names (`<cluster>-worker`) so it lines up with the legacy `hCloud.machines.worker:` block.
          #   default: {}

    # To write custom config into /etc/kubernetes/ in CP nodes.
    etcKubernetes:
      gitRepoUrl: "" # https://github.com/unbyte-de/etc-kubernetes.git

    # https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/
    admissionPlugins:
      # In Kubernetes 1.31, the default ones are:
      #   CertificateApproval, CertificateSigning, CertificateSubjectRestriction, DefaultIngressClass, DefaultStorageClass,
      #   DefaultTolerationSeconds, LimitRanger, MutatingAdmissionWebhook, NamespaceLifecycle, PersistentVolumeClaimResize,
      #   PodSecurity, Priority, ResourceQuota, RuntimeClass, ServiceAccount, StorageObjectInUseProtection,
      #   TaintNodesByCondition, ValidatingAdmissionPolicy, ValidatingAdmissionWebhook
      # Here is the list of plugins we extend:
      enable:
      - AlwaysPullImages
      - EventRateLimit
      - NodeRestriction
      - PodNodeSelector
      # https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/#eventratelimit
      # https://kubernetes.io/docs/reference/config-api/apiserver-eventratelimit.v1alpha1/
      eventRateLimit:
        enabled: true
      # https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/#podsecurity
      # https://kubernetes.io/docs/concepts/security/pod-security-admission/
      # https://kubernetes.io/docs/concepts/security/pod-security-standards/
      # https://kubernetes.io/docs/tasks/configure-pod-container/enforce-standards-admission-controller/#configure-the-admission-controller
      # https://kubernetes.io/docs/tasks/configure-pod-container/enforce-standards-namespace-labels/
      podSecurity:
        # kyverno is more flexible in terms of policy definiton and exceptions.
        enabled: true
        defaultAudit: restricted
        defaultWarn: restricted
        defaultEnforce: restricted
        exemptions:
          usernames: []
          runtimeClasses: []
          namespaces:
          - kube-system

    kubeadm:
      # If kubeProxy is disabled, cilium config requires a configmap "k8s-service-host" in namespace kube-system
      # with key "host" holding the IP of the kube-apiserver LB.
      disableKubeProxy: false
      setKubeletNodeIp: false
      etcd:
        encryption:
          # Requires a secret with the EncryptionConfiguration.
          # The secret must be in the same namespace as cluster definition in CAPI management cluster.
          # https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
          enabled: false
          secretName: etcd-encryption-configuration
          secretKey: encryption-provider.yaml
      kubeApiServer:
        # TODO: disableAnonymousAuth is not possible to enable at the moment.
        # When anonymous-auth is disabled, kubeadm can't join,
        # because it initially needs access to cluster-info configmap (in kube-public ns).
        # See also the similar issue in kube-spray:
        # https://github.com/kubernetes-sigs/kubespray/pull/11016#issuecomment-2004985001
        # https://github.com/kubernetes-sigs/kubespray/blob/master/docs/operations/hardening.md
        # TODO: disablePublicAccessClusterInfoConfigMap is not possible to enable at the moment.
        # This doesn't work because I couldn't figure out how to generate tlsBootstrapToken or kubeconfig user data.
        # Here is the error returned by `kubeadm join --config /run/kubeadm/kubeadm-join-config.yaml`:
        # > error execution phase preflight: couldn't find authentication credentials for the TLS boostrap process.
        #   Please use Token discovery, a discovery file with embedded authentication credentials or
        #   a discovery file without authentication credentials but with the TLSBootstrapToken flag
        # disableAnonymousAuth: false
        # # But at least we can remove public access to the cluster-info configmap.
        # # Ref: https://kubernetes.io/docs/reference/setup-tools/kubeadm/kubeadm-join/#turning-off-public-access-to-the-cluster-info-configmap
        # #      https://github.com/kubernetes-sigs/cluster-api/pull/10799
        # # Similar implementation in kube-spray: https://github.com/kubernetes-sigs/kubespray/pull/11016
        # disablePublicAccessClusterInfoConfigMap: false
        enableAuditLogs: true
        oidc:
          enabled: false
          issuerUrl: ""
          clientId: ""
          caFile: /etc/ssl/certs/acme-ca.crt
          useExistingSecretForCa: true
          usernamePrefix: oidc#
          usernameClaim: email
          groupsPrefix: oidc#
          groupsClaim: groups
        # There two flags control how long pods without explicit tolerations will “stick with” a node that goes
        # NotReady or Unreachable before being evicted and rescheduled. Default is 300s (5 min).
        # https://kubernetes.io/docs/reference/command-line-tools-reference/kube-apiserver/.
        defaultNotReadyTolerationSeconds: "300"
        defaultUnreachableTolerationSeconds: "300"
      # Setting this to <cluster-name>.k8s or <cluster-name>.cluster.local would be useful when using cilium clustermesh global services.
      clusterDnsDomain: "" # Defaults to "cluster.local"
      postKubeadm:
        # extraFiles:
        extraCommandsCp: ""
        extraCommandsWorker: ""

    # Here we define initial resources which are applied by CAPI (using ClusterResourceSet) just after cluster creation.
    # It installs cilium and hcloud-cloud-controller-manager in the workload cluster.
    # This creates a Job that renders helm templates for the resources and then creates a secret for each resource,
    # which are then applied in workload cluster by the ClusterResourceSet controller.
    # Note: Set `install.enabled` to `false` after first install, so secrets are cleaned up.
    # https://cluster-api.sigs.k8s.io/tasks/experimental-features/cluster-resource-set#update-from-applyonce-to-reconcile
    # https://github.com/kubernetes-sigs/cluster-api/blob/main/docs/proposals/20200220-cluster-resource-set.md
    install:
      enabled: true
      # This is only in effect if `enabled` is false. Then all resources related for this initial install process will be deleted.
      deleteAll: false
      # > If ClusterResourceSet resources will be managed by an operator after they are applied by ClusterResourceSet controller,
      # "ApplyOnce" mode must be used so that reconciliation on those resources can be delegated to the operator.
      # ref: https://github.com/kubernetes-sigs/cluster-api/blob/main/docs/proposals/20200220-cluster-resource-set.md#clusterresourceset-object-definition
      strategy: ApplyOnce
      k8sVersion: "" # e.g. "v1.31.4"
      secretLabel:
        key: name
        value: cluster-resource-set-install-once
      # https://github.com/unbyte-de/container-images/pkgs/container/container-images%2Fhelm-kubectl
      # TODO renovate
      jobImage: ghcr.io/unbyte-de/container-images/helm-kubectl:0.3.0@sha256:70c4d36234ae2655f71559b4fa97feac53c5287c72cbd13f3387a1ca6ff1926f
      # extraRoles:
      resources:
        10-cilium:
          enabled: true
          strategy: ApplyOnce
          repoUrl: https://helm.cilium.io/
          # repoCreds:
          #   username: ""
          #   password: ""
          chart: cilium
          releaseName: cilium
          version: 1.20.1
          namespace: kube-system
          createNamespace: false
          secretsCount: 1
          values: |-
            rollOutCiliumPods: true
            priorityClassName: "system-node-critical"
            hubble:
              enabled: false
            operator:
              rollOutPods: true
              priorityClassName: "system-node-critical"
              replicas: 2  # Default is 2
              # Let operator to be scheduled on empty nodes
              # https://github.com/cilium/cilium/pull/40137
              tolerations:
              - key: "node-role.kubernetes.io/control-plane"
                operator: Exists
              - key: "node-role.kubernetes.io/master" #deprecated
                operator: Exists
              - key: "node.kubernetes.io/not-ready"
                operator: Exists
              - key: "node.cilium.io/agent-not-ready"
                operator: Exists
              # Added by us.
              - key: "node.cloudprovider.kubernetes.io/uninitialized"
                operator: Equal
                value: "true"
                effect: NoSchedule
              - key: "node.cluster.x-k8s.io/uninitialized"
                operator: Exists
                effect: NoSchedule
            {{- if .Values.kubeadm.disableKubeProxy }}
            k8sServiceHostRef:
              name: k8s-service-host
              key: host
            k8sServicePort: "6443"
            {{- end }}
            devices: "eth+"
            ipam:
              mode: "kubernetes"
            {{- if .Values.kubeadm.disableKubeProxy }}
            socketLB:
              enabled: true
              hostNamespaceOnly: true
            kubeProxyReplacement: "true"
            {{- else }}
            kubeProxyReplacement: false
            {{- end }}
            loadBalancer:
              algorithm: maglev
            {{- $networking := (include "networking" $) | fromYaml }}
            {{- if $networking.hcloudNetworkEnabled  }}
            routingMode: "native"
            ipv4NativeRoutingCIDR: {{ $networking.podsIpv4Cidr | quote }}
            {{- else }}
            routingMode: tunnel
            {{- end }}
            bandwidthManager:
              enabled: true
            bpf:
              masquerade: true
            encryption:
              enabled: true
              type: wireguard
              nodeEncryption: true
            clustermesh:
              apiserver:
                tls:
                  auto:
                    method: cronJob
            hostFirewall:
              enabled: true
            # Audit mode will be disabled during argocd sync after policies are applied.
            policyAuditMode: true
            policyEnforcementMode: always
        20-hccm:
          enabled: true
          strategy: ApplyOnce
          repoUrl: https://charts.hetzner.cloud
          chart: hcloud-cloud-controller-manager
          releaseName: hccm
          version: 1.36.0
          namespace: kube-system
          createNamespace: false
          secretsCount: 1
          values: |-
            env:
              HCLOUD_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hcloud
                    key: token
            networking:
              {{- $networking := (include "networking" $) | fromYaml }}
              {{- if $networking.hcloudNetworkEnabled  }}
              enabled: true
              clusterCIDR: {{ $networking.podsIpv4Cidr | quote }}
              network:
                valueFrom:
                  secretKeyRef:
                    name: hcloud
                    key: network
              {{- else }}
              enabled: false
              {{- end }}
