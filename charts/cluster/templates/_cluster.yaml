{{- define "cluster.cluster" -}}
{{- include "cluster.validate" . -}}
---
{{- $networking := (include "networking" .) | fromYaml }}
{{- $machines := (include "machines" .) | fromYaml }}
{{- /*
https://doc.crds.dev/github.com/kubernetes-sigs/cluster-api/cluster.x-k8s.io/Cluster/v1beta2@v1.13.2
*/}}
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: {{ include "cluster-name" . }}
  namespace: {{ .Release.Namespace }}
  # annotations:
  #   argocd.argoproj.io/sync-wave: ""
  labels:
    name: {{ include "cluster-name" . }}
    {{- include "cluster.labels" . | nindent 4 }}
spec:
  clusterNetwork:
    apiServerPort: {{ $networking.apiPort }}
    # Domain name for services.
    {{- /*
    Moved here from KubeadmControlPlane.spec.kubeadmConfigSpec.clusterConfiguration.networking.dnsDomain,
    which was removed in the CAPI v1beta2 contract (duplicate of Cluster.spec.clusterNetwork.serviceDomain).
    */}}
    {{- with .Values.kubeadm.clusterDnsDomain }}
    serviceDomain: {{ . | quote }}
    {{- end }}
    services:
      cidrBlocks:
      - {{ $networking.servicesIpv4Cidr | quote }}
    pods:
      cidrBlocks:
      - {{ $networking.podsIpv4Cidr | quote }}
  {{- /*
  ControlPlaneEndpoint represents the endpoint used to communicate with the control plane.
  See HetznerCluster.spec.controlPlaneEndpoint
  v1beta2: host rejects empty strings, so only emit host when the LB IP is known -- never emit
  host: "". port is always set. The controller populates host once the LB is provisioned; that
  drift is absorbed by the Application's ignoreDifferences on /spec/controlPlaneEndpoint/host.
  */}}
  controlPlaneEndpoint:
    {{- if .Values.hCloud.lb.existing.ip }}
    host: {{ .Values.hCloud.lb.existing.ip | quote }}
    {{- end }}
    port: {{ $networking.apiPort }}
  {{- /*
  v1beta2: controlPlaneRef/infrastructureRef are ContractVersionedObjectReference
  (apiGroup + kind + name). apiVersion -> apiGroup; namespace removed (must match the Cluster's namespace).
  */}}
  controlPlaneRef:
    {{- if eq .Values.capi.providers.controlPlane.name "kubeadm" }}
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    {{- end }}
    name: {{ include "cp-name" . }}
  infrastructureRef:
    {{- if eq .Values.capi.providers.infrastructure.name "hetzner" }}
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: HetznerCluster
    {{- end }}
    name: {{ include "cluster-name" . }}
{{- if eq .Values.capi.providers.infrastructure.name "hetzner" }}
{{- $bareMetal := eq (include "cluster.hasBareMetalPools" .) "true" }}
---
{{- /*
`k explain HetznerCluster` for more information
https://syself.com/docs/caph/reference/hetzner-cluster
In HetznerCluster you can define everything related to the general components of the cluster as well as those properties, which are valid cluster-wide.
*/}}
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HetznerCluster
metadata:
  name: {{ include "cluster-name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    {{- if and $bareMetal .Values.hCloud.robot.useHrobotProviderID }}
    capi.syself.com/use-hrobot-provider-id-for-baremetal: "true"
    {{- end }}
spec:
  controlPlaneEndpoint:
    {{- /*
    Set by the controller.
    Set to the IP of the Load Balancer.
    The endpoint to communicate with the control plane.
    */}}
    {{- if .Values.hCloud.lb.existing.ip }}
    host: {{ .Values.hCloud.lb.existing.ip | quote }}
    {{- else }}
    host: ""
    {{- end }}
    port: {{ $networking.apiPort }}
  controlPlaneLoadBalancer:
    enabled: true
    {{- if .Values.hCloud.lb.existing.ip }}
    name: {{ include "lb-existing-name" . }}
    region: {{ $networking.region | required "ERROR: networking region is required." }}
      {{- with .Values.hCloud.lb.existing.extraServices }}
    extraServices:
      {{- toYaml . | nindent 4 }}
      {{- end }}
    {{- else }}
      {{- range $key, $value := .Values.hCloud.lb.new }}
      {{- if has $key (list "region" "port") }}
      {{- $key | nindent 4 }}: {{ tpl $value $ | trim }}
      {{- else if eq (kindOf $value) "slice" }}
      {{- $key | nindent 4 }}: {{- toYaml $value | nindent 4 }}
      {{- else }}
      {{- $key | nindent 4 }}: {{ $value }}
      {{- end }}
      {{- end }}
    {{- end }}
  controlPlaneRegions:
  - {{ $networking.region | required "ERROR: networking region is required." }}
  {{- /*
  HCloudNetwork defines details about the private Network for Hetzner Cloud.
  If left empty, no private Network is configured.
  */}}
  hcloudNetwork:
    enabled: {{ $networking.hcloudNetworkEnabled }}
    {{- if $networking.hcloudNetworkEnabled }}
    cidrBlock: {{ $networking.networkIpv4Cidr | quote }}
    networkZone: {{ $networking.networkZone }}
    subnetCidrBlock: {{ $networking.subnetIpv4Cidr | quote }}
    {{- end }}
  hcloudPlacementGroups: {{- toYaml $machines.placementGroups | nindent 2 }}
  {{- /*
  Reference to secret where Hetzner API credentials are stored
  */}}
  hetznerSecretRef:
    name: {{ .Values.hCloud.token.secretName }}
    key:
      hcloudToken: {{ .Values.hCloud.token.secretKey }}
      hetznerRobotPassword: robot-password
      hetznerRobotUser: robot-user
  {{- if or .Values.hCloud.sshKeys $bareMetal }}
  sshKeys:
    {{- with .Values.hCloud.sshKeys }}
    hcloud:
    {{- range . }}
    - name: {{ . }}
    {{- end }}
    {{- end }}
    {{- if $bareMetal }}
    {{- /*
    SSH key for the rescue system of dedicated servers. The key's name must match a key in Robot.
    https://syself.com/docs/caph/topics/managing-ssh-keys
    */}}
    robotRescueSecretRef: {{- toYaml (.Values.hCloud.robot.rescueSshSecretRef | required "ERROR: hCloud.robot.rescueSshSecretRef is required for bare-metal worker pools.") | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end -}}
