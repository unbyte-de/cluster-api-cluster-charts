{{- define "cluster.machine-health-checks" -}}
{{- /*
v1beta2 MachineHealthCheck restructure:
  spec.maxUnhealthy         -> spec.remediation.triggerIf.unhealthyLessThanOrEqualTo
  spec.nodeStartupTimeout   -> spec.checks.nodeStartupTimeoutSeconds (int seconds)
  spec.unhealthyConditions  -> spec.checks.unhealthyNodeConditions (timeout -> timeoutSeconds int)
  spec.remediationTemplate  -> spec.remediation.templateRef
Note: remediation.templateRef keeps apiVersion (MachineHealthCheckRemediationTemplateReference),
it is NOT a ContractVersionedObjectReference, so the HCloudRemediationTemplate ref is unchanged.
*/}}
{{- $machines := (include "machines" .) | fromYaml }}
{{- if $machines.cp.healthCheck.enabled }}
{{- if and (eq .Values.capi.providers.infrastructure.name "hetzner") $machines.cp.remediation.enabled }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudRemediationTemplate
metadata:
  name: cp-remediation
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
spec:
  template:
    spec:
      strategy:
        retryLimit: {{ $machines.cp.remediation.retryLimit }}
        timeout: {{ $machines.cp.remediation.timeout }}
        type: {{ $machines.cp.remediation.type }}
{{- end }}
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: {{ include "cp-name" . }}-unhealthy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
spec:
  clusterName: {{ include "cluster-name" . }}
  checks:
    nodeStartupTimeoutSeconds: {{ include "cluster.durationToSeconds" $machines.cp.healthCheck.nodeStartupTimeout }}
    unhealthyNodeConditions:
    {{- range $machines.cp.healthCheck.unhealthyConditions }}
    - type: {{ .type }}
      status: {{ .status | quote }}
      timeoutSeconds: {{ include "cluster.durationToSeconds" .timeout }}
    {{- end }}
  remediation:
    {{- if $machines.cp.remediation.enabled }}
    templateRef:
      {{- if eq .Values.capi.providers.infrastructure.name "hetzner" }}
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: HCloudRemediationTemplate
      {{- end }}
      name: cp-remediation
    {{- end }}
    triggerIf:
      unhealthyLessThanOrEqualTo: {{ $machines.cp.healthCheck.maxUnhealthy | quote }}
  selector:
    matchLabels:
      cluster.x-k8s.io/control-plane: ""
{{- end }}
{{- if $machines.worker.healthCheck.enabled }}
{{- if and (eq .Values.capi.providers.infrastructure.name "hetzner") $machines.worker.remediation.enabled }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudRemediationTemplate
metadata:
  name: worker-remediation
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
spec:
  template:
    spec:
      strategy:
        retryLimit: {{ $machines.worker.remediation.retryLimit }}
        timeout: {{ $machines.worker.remediation.timeout }}
        type: {{ $machines.worker.remediation.type }}
{{- end }}
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: {{ include "cluster-name" . }}-worker-unhealthy
  namespace: {{ .Release.Namespace }}
  # annotations:
  #   argocd.argoproj.io/sync-wave: ""
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
spec:
  clusterName: {{ include "cluster-name" . }}
  checks:
    nodeStartupTimeoutSeconds: {{ include "cluster.durationToSeconds" $machines.worker.healthCheck.nodeStartupTimeout }}
    unhealthyNodeConditions:
    {{- range $machines.worker.healthCheck.unhealthyConditions }}
    - type: {{ .type }}
      status: {{ .status | quote }}
      timeoutSeconds: {{ include "cluster.durationToSeconds" .timeout }}
    {{- end }}
  remediation:
    {{- if $machines.worker.remediation.enabled }}
    templateRef:
      {{- if eq .Values.capi.providers.infrastructure.name "hetzner" }}
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: HCloudRemediationTemplate
      {{- end }}
      name: worker-remediation
    {{- end }}
    triggerIf:
      unhealthyLessThanOrEqualTo: {{ $machines.worker.healthCheck.maxUnhealthy | quote }}
  selector:
    matchLabels:
      nodepool: {{ include "worker-name" . }}
{{- end }}
{{- end -}}
