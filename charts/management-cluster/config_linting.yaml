---
cluster:
  name: "unbyte-hcloud-fsn1-linting-01"

hCloud:
  networking:
    servicesIpv4Cidr: "10.1.8.0/21"
    podsIpv4Cidr: "10.1.16.0/20"
    region: "fsn1"
  machines:
    cp:
      # type: "cpx32"
      # osVersion: "2404"
      # k8sVersion: "v1.35.6"
      buildTimestamp: "1744781328"
      # replicas: 3
    workers:
      defaults:
        # type: "cpx42"
        # osVersion: "2404"
        # k8sVersion: "v1.35.6"
        buildTimestamp: "1744781328"
      pools:
        gpu:
          replicas: 1
          nodeLabels:
            nodepool: gpu
          nodeTaints:
          - key: nvidia.com/gpu
            value: present
            effect: NoSchedule
          bareMetal:
            enabled: true
            hosts:
            - serverID: 1234567
              rootDeviceHints:
                raid:
                  wwn:
                  - "eui.0025388a21b0a1b2"
                  - "eui.0025388a21b0a1b3"
              description: "GPU server"

install:
  # enabled: false
  # # deleteAll: true
  envName: prod
  capiMgtName: capi-mgt
